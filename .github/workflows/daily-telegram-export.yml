name: Daily Telegram Export

on:
  schedule:
    # Runs at 21:00 UTC every day (04:00 Cambodia UTC+7)
    - cron: '0 21 * * *'
  workflow_dispatch: {}

jobs:
  post-export:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily export cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_TARGET_URL: ${{ secrets.CRON_TARGET_URL }}
        run: |
          if [ -z "$CRON_TARGET_URL" ]; then
            echo "CRON_TARGET_URL is not set. Set this secret to the public URL of your deployed site, e.g. https://your-site.vercel.app/api/cron/daily-report" >&2
            exit 1
          fi

          echo "Calling $CRON_TARGET_URL"
          # Use curl with retries for reliability
          curl --retry 3 --retry-delay 5 -sfS -X POST "$CRON_TARGET_URL" -H "x-cron-secret: $CRON_SECRET" -o /tmp/cron-response.json || true
          echo "Response:" && cat /tmp/cron-response.json || true
      - name: Validate deployment after cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_TARGET_URL: ${{ secrets.CRON_TARGET_URL }}
        run: |
          VALIDATE_URL="${CRON_TARGET_URL%/}/api/deploy/validate"
          echo "Calling $VALIDATE_URL"
          curl -sfS -H "x-cron-secret: $CRON_SECRET" "$VALIDATE_URL" -o /tmp/validate.json
          cat /tmp/validate.json
          if ! grep -q '"ok":true' /tmp/validate.json; then
            echo "Validation failed: see /tmp/validate.json" >&2
            exit 1
          fi
