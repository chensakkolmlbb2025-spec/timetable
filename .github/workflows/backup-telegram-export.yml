name: 🔄 Backup Daily Export (Safety Net)

# This is a backup workflow that runs if the primary workflow fails
# Runs 2 hours after the primary workflow (06:00 Cambodia time)

on:
  schedule:
    # 23:00 UTC = 06:00 Cambodia (2 hours after primary)
    - cron: '0 23 * * *'
  workflow_dispatch: {}

jobs:
  backup-send:
    name: Backup Send (Safety Net)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: 🔍 Check if primary workflow succeeded
        id: check_primary
        env:
          CRON_TARGET_URL: ${{ secrets.CRON_TARGET_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          STATUS_URL="${CRON_TARGET_URL%/}/api/export/status?date=$TODAY"
          
          echo "🔍 Checking if primary workflow already sent report for $TODAY"
          
          RESPONSE=$(curl -sfS -H "x-cron-secret: $CRON_SECRET" "$STATUS_URL" 2>&1 || echo '{"success":false}')
          echo "Response: $RESPONSE"
          
          if echo "$RESPONSE" | grep -q '"status":"success"'; then
            echo "✅ Primary workflow already succeeded - backup not needed"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ No successful send found - backup will attempt to send"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 🆘 Backup Send Attempt
        if: steps.check_primary.outputs.skip != 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_TARGET_URL: ${{ secrets.CRON_TARGET_URL }}
        run: |
          echo "🆘 BACKUP WORKFLOW ACTIVATED"
          echo "Primary workflow may have failed - attempting backup send"
          
          CRON_ENDPOINT="${CRON_TARGET_URL%/}/api/cron/daily-report"
          
          RESPONSE=$(curl --retry 10 --retry-delay 10 --retry-all-errors \
            --max-time 120 --connect-timeout 20 \
            -sfS -X POST "$CRON_ENDPOINT" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            2>&1 || echo '{"success":false}')
          
          echo "📨 Response: $RESPONSE"
          
          if echo "$RESPONSE" | grep -q '"success":true'; then
            echo "✅ BACKUP SUCCESS: Report sent via backup workflow"
          else
            echo "❌ BACKUP FAILED: Could not send via backup workflow either"
            echo "⚠️  CRITICAL: Both primary and backup workflows failed"
            exit 1
          fi

      - name: 📊 Backup Workflow Summary
        if: always()
        run: |
          echo "================================"
          echo "🔄 BACKUP WORKFLOW SUMMARY"
          echo "================================"
          echo "Date: $(date -u +%Y-%m-%d)"
          echo "Time: $(date -u +%H:%M:%S) UTC (06:00 Cambodia)"
          echo ""
          
          if [ "${{ steps.check_primary.outputs.skip }}" == "true" ]; then
            echo "Status: ✅ PRIMARY SUCCEEDED (Backup not needed)"
          else
            echo "Status: 🆘 BACKUP ACTIVATED (Primary may have failed)"
          fi
          echo "================================"
